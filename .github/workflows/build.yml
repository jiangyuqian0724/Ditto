name: Build Ditto Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: pwsh
        run: |
          $build = [int]$env:GITHUB_RUN_NUMBER
          "VERSION_FILENAME=3_25_${build}_0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION_DOT_FILENAME=3.25.${build}.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build x64 Release
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /m /p:Configuration=Release /p:Platform=x64

      - name: Set Ditto.exe version
        shell: pwsh
        run: |
          DittoSetup\rcedit-x64 Release64\Ditto.exe --set-file-version $env:VERSION_DOT_FILENAME --set-product-version $env:VERSION_DOT_FILENAME

      - name: Build installer EXE
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: DittoSetup\DittoSetup_10.iss

      - name: Build portable ZIP
        shell: cmd
        run: DittoSetup\BuildPortableZIP.bat "DittoPortable_%VERSION_FILENAME%" bit64

      - name: Verify release files
        shell: pwsh
        run: |
          $installer = "DittoSetup\output\DittoSetup_$env:VERSION_FILENAME.exe"
          $portable = "DittoSetup\output\DittoPortable_$env:VERSION_FILENAME.zip"
          if (!(Test-Path $installer)) { throw "Installer not found: $installer" }
          if (!(Test-Path $portable)) { throw "Portable ZIP not found: $portable" }
          Get-Item $installer, $portable | Select-Object Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ditto-${{ env.VERSION_DOT_FILENAME }}
          if-no-files-found: error
          path: |
            DittoSetup\output\DittoSetup_${{ env.VERSION_FILENAME }}.exe
            DittoSetup\output\DittoPortable_${{ env.VERSION_FILENAME }}.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:VERSION_DOT_FILENAME
          $installer = "DittoSetup\output\DittoSetup_$env:VERSION_FILENAME.exe"
          $portable = "DittoSetup\output\DittoPortable_$env:VERSION_FILENAME.zip"
          $notes = "Automated x64 build from commit $env:GITHUB_SHA. Includes the installer EXE and portable ZIP."

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable --clobber
          } else {
            gh release create $tag $installer $portable --target $env:GITHUB_SHA --title $tag --notes $notes
          }

# Actions enabled; this commit triggers the first fork build.
